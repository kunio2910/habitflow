name: Deploy HabitFlow to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -s out/index.html
          test -f out/.nojekyll
          test -d out/_next/static
          grep -q '/habitflow/_next/' out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed website
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..12}; do
            status="$(curl --silent --location --output /tmp/habitflow.html --write-out '%{http_code}' "${PAGE_URL}")"
            if [ "$status" = "200" ] && grep -q '<title' /tmp/habitflow.html; then
              echo "Website hoạt động tại ${PAGE_URL}"
              exit 0
            fi
            echo "Lần kiểm tra ${attempt}: HTTP ${status}; thử lại sau 10 giây."
            sleep 10
          done
          echo "Deployment không trả về trang HTML hợp lệ tại ${PAGE_URL}."
          exit 1
